name: Channel Emas

on:
  schedule:
    # Waktu MYT = UTC + 8 jam
    - cron: "9 0 * * *"       # 8:09 pagi  -> Harga GAP
    - cron: "9 2 * * *"       # 10:09 pagi -> Item Gold Bar / Dinar / Perak
    - cron: "9 5 * * *"       # 1:09 petang -> Harga PG Jewel + Non-PG Buyback
    - cron: "9 10 * * *"      # 6:09 petang -> Item PG Jewel
    - cron: "9 12 * * *"      # 8:09 malam -> Harga GAP
    - cron: "9 14 * * *"      # 10:09 malam -> Ilmu Emas
    - cron: "39 14 * * *"     # 10:39 malam -> Item Gold Bar / Dinar / Perak
    - cron: "24,54 0-13 * * *" # setiap 30 min, 8:24 pagi - 9:54 malam -> semak Price Alert
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod (gap / jewel / alert / ilmu / item / pgitem / wa-channels)"
        required: true
        default: "gap"

permissions:
  contents: write

concurrency:
  group: channel-emas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tentukan mod
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "9 0 * * *"|"9 12 * * *") echo "mode=gap" >> $GITHUB_OUTPUT ;;
              "9 2 * * *"|"39 14 * * *") echo "mode=pgitem" >> $GITHUB_OUTPUT ;;
              "9 5 * * *") echo "mode=jewel" >> $GITHUB_OUTPUT ;;
              "9 10 * * *") echo "mode=item" >> $GITHUB_OUTPUT ;;
              "9 14 * * *") echo "mode=ilmu" >> $GITHUB_OUTPUT ;;
              *) echo "mode=alert" >> $GITHUB_OUTPUT ;;
            esac
          fi
      - name: Jalankan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: "@kenaliemas"
          TG_CHANNEL_ENABLED: "1"
          ALERT_THRESHOLD: "3"
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WA_CHANNEL_ID: ${{ secrets.WA_CHANNEL_ID }}
          # Suis WhatsApp auto: tukar "0" kepada "1" bila sudah bersedia. Tukar kembali "0" untuk berhenti.
          WA_ENABLED: "1"
          # Mod yang dihantar auto ke WhatsApp Channel.
          WA_AUTO_MODES: "gap,jewel,alert,item,pgitem,ilmu"
        run: python post.py ${{ steps.m.outputs.mode }}
      - name: Simpan state
        run: |
          git config user.name "channel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "kemas kini state" && git push)
