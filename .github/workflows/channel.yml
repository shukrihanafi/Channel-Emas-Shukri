name: Channel Emas

on:
  # Jadual dikendalikan oleh cron-job.org (POST ke workflow_dispatch)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod (gap / jewel / alert / ilmu / item / pgitem / berita / testimoni / fb-check / wa-channels)"
        required: true
        default: "gap"
      url:
        description: "Pautan berita (pilihan, untuk mod berita sahaja)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: channel-emas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tentukan mod
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "9 0 * * *"|"9 12 * * *") echo "mode=gap" >> $GITHUB_OUTPUT ;;
              "9 13 * * *") if [ "$(TZ=Asia/Kuala_Lumpur date +%F)" = "2026-11-03" ]; then echo "mode=gap" >> $GITHUB_OUTPUT; else echo "mode=skip" >> $GITHUB_OUTPUT; fi ;;
              "9 2 * * *"|"39 14 * * *") echo "mode=pgitem" >> $GITHUB_OUTPUT ;;
              "9 5 * * *") echo "mode=jewel" >> $GITHUB_OUTPUT ;;
              "9 10 * * *") echo "mode=item" >> $GITHUB_OUTPUT ;;
              "9 14 * * *") echo "mode=ilmu" >> $GITHUB_OUTPUT ;;
              *) echo "mode=alert" >> $GITHUB_OUTPUT ;;
            esac
          fi
      - name: Pasang pelayar (berita, atau pengawas jika slot berita terlepas)
        if: steps.m.outputs.mode != 'skip'
        run: |
          M="${{ steps.m.outputs.mode }}"
          HM=$(TZ=Asia/Kuala_Lumpur date +%H%M)
          TODAY=$(TZ=Asia/Kuala_Lumpur date +%F)
          NEED=0
          case "$M" in berita*) NEED=1 ;; esac
          if [ "$M" = "alert" ] && [ "$((10#$HM))" -ge 1321 ] && [ "$((10#$HM))" -le 1540 ] && ! grep -q "$TODAY|13:09" data/state.json; then NEED=1; fi
          NEEDT=0
          case "$M" in testimoni*) NEEDT=1 ;; esac
          if [ "$M" = "alert" ] && [ "$((10#$HM))" -ge 1521 ] && [ "$((10#$HM))" -le 1740 ] && ! grep -q "$TODAY|15:09" data/state.json; then NEEDT=1; fi
          if [ "$NEEDT" = "1" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr; fi
          if [ "$NEED" = "1" ]; then
            pip install playwright
            playwright install --with-deps chromium
          fi
      - name: Jalankan bot
        if: steps.m.outputs.mode != 'skip'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: "@kenaliemas"
          TG_CHANNEL_ENABLED: "1"
          ALERT_THRESHOLD: "3"
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GMAIL_USER: "shukripublicgold@gmail.com"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WA_CHANNEL_ID: ${{ secrets.WA_CHANNEL_ID }}
          # Suis WhatsApp auto: tukar "0" kepada "1" bila sudah bersedia. Tukar kembali "0" untuk berhenti.
          WA_ENABLED: "1"
          # Mod yang dihantar auto ke WhatsApp Channel.
          WA_AUTO_MODES: "gap,jewel,alert,item,pgitem,ilmu,berita,testimoni"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_URL: ${{ github.event.inputs.url }}
        run: python post.py ${{ steps.m.outputs.mode }}
      - name: Simpan state
        if: steps.m.outputs.mode != 'skip'
        run: |
          git config user.name "channel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "kemas kini state" && git push)
