name: Channel Emas

on:
  # Jadual dikendalikan oleh cron-job.org (POST ke workflow_dispatch)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod (gap / jewel / alert / ilmu / item / pgitem / berita / berita-test / wa-channels)"
        required: true
        default: "gap"
      url:
        description: "Pautan berita (pilihan, untuk mod berita / berita-test)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: channel-emas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tentukan mod
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "9 0 * * *"|"9 12 * * *") echo "mode=gap" >> $GITHUB_OUTPUT ;;
              "9 13 * * *") if [ "$(TZ=Asia/Kuala_Lumpur date +%F)" = "2026-11-03" ]; then echo "mode=gap" >> $GITHUB_OUTPUT; else echo "mode=skip" >> $GITHUB_OUTPUT; fi ;;
              "9 2 * * *"|"39 14 * * *") echo "mode=pgitem" >> $GITHUB_OUTPUT ;;
              "9 5 * * *") echo "mode=jewel" >> $GITHUB_OUTPUT ;;
              "9 10 * * *") echo "mode=item" >> $GITHUB_OUTPUT ;;
              "9 14 * * *") echo "mode=ilmu" >> $GITHUB_OUTPUT ;;
              *) echo "mode=alert" >> $GITHUB_OUTPUT ;;
            esac
          fi
      - name: Pasang pelayar (mod berita sahaja)
        if: startsWith(steps.m.outputs.mode, 'berita')
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Jalankan bot
        if: steps.m.outputs.mode != 'skip'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: "@kenaliemas"
          TG_CHANNEL_ENABLED: "1"
          ALERT_THRESHOLD: "3"
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WA_CHANNEL_ID: ${{ secrets.WA_CHANNEL_ID }}
          # Suis WhatsApp auto: tukar "0" kepada "1" bila sudah bersedia. Tukar kembali "0" untuk berhenti.
          WA_ENABLED: "1"
          # Mod yang dihantar auto ke WhatsApp Channel.
          WA_AUTO_MODES: "gap,jewel,alert,item,pgitem,ilmu,berita"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_URL: ${{ github.event.inputs.url }}
        run: python post.py ${{ steps.m.outputs.mode }}
      - name: Simpan state
        if: steps.m.outputs.mode != 'skip'
        run: |
          git config user.name "channel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "kemas kini state" && git push)
